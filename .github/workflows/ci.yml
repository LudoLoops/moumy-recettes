name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Audit high-severity vulnerabilities
        run: bun audit --audit-level=high

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Preview tests
        run: bun run test:preview

      - name: Lint
        run: bun run lint

      - name: Static production build
        run: bun run build

      - name: Verify generated social metadata and image assets
        run: bun run test:og
